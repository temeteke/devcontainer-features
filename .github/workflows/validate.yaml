name: Validate Dev Container Features

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and Bash syntax
        run: bash test/validate.sh
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli
      - name: Validate Feature packaging
        run: devcontainer features package ./src
